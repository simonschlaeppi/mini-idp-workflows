   name: CodeQL
   on:
     push:
       branches: [main]
     pull_request:
       branches: [main]
     schedule:
       - cron: "0 5 * * 1"
   permissions:
     contents: read
     security-events: write
     actions: read
   jobs:
     analyze:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: github/codeql-action/init@v4
           with:
             languages: actions
             build-mode: none
         - uses: github/codeql-action/analyze@v4